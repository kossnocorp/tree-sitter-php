[package]
name = "tree-sitter-php"
description = "PHP grammar for tree-sitter"
version = "0.24.2"
authors = [
  "Max Brunsfeld <maxbrunsfeld@gmail.com>",
  "Amaan Qureshi <amaanq12@gmail.com>",
]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "php"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/tree-sitter/tree-sitter-php"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "LICENSE",
  "common",
  "bindings/rust",
  "php/grammar.js",
  "php/src",
  "php_only/grammar.js",
  "php_only/src",
  "queries",
  "tree-sitter.json"
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = { git = "https://github.com/kossnocorp/tree-sitter", branch = "wasm-all" }

[build-dependencies]
cc = "1.1"

[dev-dependencies]
tree-sitter = { git = "https://github.com/kossnocorp/tree-sitter", branch = "wasm-all" }

# NOTE: Use these for local development with path overrides:

# [patch."https://github.com/kossnocorp/tree-sitter"]
# tree-sitter = { path = "../tree-sitter/lib" }
# tree-sitter-language = { path = "../tree-sitter/crates/language" }

# [patch."https://github.com/kossnocorp/tree-sitter-php"]
# tree-sitter-php = { path = "../tree-sitter-php" }

[workspace]